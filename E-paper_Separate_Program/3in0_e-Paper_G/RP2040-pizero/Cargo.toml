[package]
name = "epd-3in0-e-paper-g"
version = "0.1.0"
edition = "2024"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp2040", "boot2-w25q080"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-futures = { version = "0.1.2" }
embassy-usb = { version = "0.6.0", features = ["max-interface-count-2", "max-handler-count-2"] }

[dependencies]
embedded-storage-async = "0.4.1"
embedded-hal = { version = "1.0.0" }
embedded-graphics = "0.8.2"
u8g2-fonts = { version = "0.7.2", features = ["embedded_graphics_textstyle"] }
heapless = "0.9.2"
hypher = { version = "0.1.7", default-features = false, features = ["english"] }

defmt = "1.0.1"
defmt-rtt = "1.1.0"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies.panic-reset]
version = "0.1.1"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies.cortex-m-rt]
version = "0.7.5"





[profile.release]
debug = 2
lto = false
opt-level = 's'

[[bin]]
name = "recipe_reader_rs"
path = "src/main.rs"
test = false

[lib]
name = "recipe_reader_logic"
path = "src/lib.rs"
test = true


